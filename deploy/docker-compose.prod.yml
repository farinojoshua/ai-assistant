# Production stack. deploy/.env (next to this file) is auto-loaded for
# ${VAR} substitution by `podman compose`, `podman-compose`, and
# `docker compose`. deploy/setup.sh runs this for you.
#   cd deploy && podman compose -p ai-assistant -f docker-compose.prod.yml up -d --build

services:
  app_db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_APP}
      POSTGRES_DB: app
    volumes:
      - app_db:/var/lib/postgresql/data
    restart: unless-stopped

  company_db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_COMPANY}
      POSTGRES_DB: company
    volumes:
      - company_db:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      APP_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD_APP}@app_db:5432/app
      COMPANY_DATABASE_URL: postgresql+psycopg://company:${POSTGRES_PASSWORD_COMPANY}@company_db:5432/company
      COMPANY_DATABASE_WRITE_URL: postgresql+psycopg://company:${POSTGRES_PASSWORD_COMPANY}@company_db:5432/company
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama_cloud}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-gemma4:31b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /app/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-rahasia123}
      SEED_COMPANY_DATA: ${SEED_COMPANY_DATA:-1}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - app_db
      - company_db
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  app_db:
  company_db:
  uploads:

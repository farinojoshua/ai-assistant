# Production stack. deploy/.env (next to this file) is auto-loaded for
# ${VAR} substitution by `podman compose`, `podman-compose`, and
# `docker compose`. deploy/setup.sh runs this for you.
#   cd deploy && podman compose -p ai-assistant -f docker-compose.prod.yml up -d --build

services:
  app_db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_APP}
      POSTGRES_DB: app
    volumes:
      - app_db:/var/lib/postgresql/data
    restart: unless-stopped

  company_db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_COMPANY}
      POSTGRES_DB: company
    volumes:
      - company_db:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      APP_DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD_APP}@app_db:5432/app
      COMPANY_DATABASE_URL: postgresql+psycopg://company:${POSTGRES_PASSWORD_COMPANY}@company_db:5432/company
      COMPANY_DATABASE_WRITE_URL: postgresql+psycopg://company:${POSTGRES_PASSWORD_COMPANY}@company_db:5432/company
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama_cloud}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-gemma4:31b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      UPLOAD_DIR: /app/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-rahasia123}
      SEED_COMPANY_DATA: ${SEED_COMPANY_DATA:-1}
    volumes:
      - uploads:/app/uploads
    # also published on the host loopback so an existing host proxy
    # (Caddy / nginx / Traefik) can reach it — see deploy/proxy.yml for
    # the bundled-nginx alternative
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      - app_db
      - company_db
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_db:
  company_db:
  uploads:
